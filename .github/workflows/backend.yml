name: ASP.NET Core CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/NBAPlayerStatsAPI  # <-- adjust based on your .csproj path

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'  # Match your project SDK (e.g., 6.0.x, 8.0.x)

      - name: Restore dependencies
        run: dotnet restore backend/NBAPlayerStatsAPI/NBAPlayerStatsApp.sln

      - name: Build
        run: dotnet build backend/NBAPlayerStatsAPI/NBAPlayerStatsApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/NBAPlayerStatsTests/NBAPlayerStatsTests.csproj --no-build --verbosity normal || echo "No tests yet"
